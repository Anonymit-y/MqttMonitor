apiVersion: 1

providers:
  - name: 'Farm Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Update this path to match the new compose mount
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
